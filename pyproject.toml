[project]
name = "browser-auto-ops"
version = "0.1.0"
description = "ADS/CDP-first browser automation engine with state-index actions, trace, network capture, and skill forge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "playwright>=1.60",
    "pydantic>=2.7",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "typer>=0.12",
    "uvicorn>=0.30",
    "websocket-client>=1.8",
]

[project.urls]
Homepage = "https://github.com/DingShineShine/browser-auto-ops"
Repository = "https://github.com/DingShineShine/browser-auto-ops"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
compile = [
    "cython>=3.0",
    "setuptools>=69",
    "ziglang",
]

[project.scripts]
bao = "browser_auto_ops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "downloads",
    ".bao",
    ".agents",
    "docs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/browser_auto_ops"]
exclude = [
    "src/browser_auto_ops/snapshot/scanner.py",
    "src/browser_auto_ops/actions/executor.py",
    "src/browser_auto_ops/providers/chrome_direct.py",
    "src/browser_auto_ops/providers/raw_cdp.py",
    "src/browser_auto_ops/providers/adspower_cdp.py",
    "src/browser_auto_ops/sessions/manager.py",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
