stages:
  - test
  - publish

variables:
  UV_PYTHON: "3.12"

.test:
  stage: test
  image: python:3.12
  script:
    - pip install --quiet uv
    - uv sync --extra dev
    - uv run pytest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Windows wheel + GitLab Package Registry (private PyPI).
# Needs a Windows runner with Python 3.12 and MSVC or zig.
# If no Windows runner exists, publish from a workstation:
#   powershell -File scripts/publish_gitlab.ps1
publish:
  stage: publish
  tags:
    - windows
  script:
    - pip install --quiet uv cython setuptools ziglang hatchling
    - python hatch_build.py
    - uv build --wheel
    - uv publish --publish-url "%CI_API_V4_URL%/projects/%CI_PROJECT_ID%/packages/pypi" --username gitlab-ci-token --password "%CI_JOB_TOKEN%"
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
